version: '3.9'

services:
  bgr-agente-comercial:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bgr-agente-comercial
    restart: unless-stopped
    ports:
      - "3090:3090"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
